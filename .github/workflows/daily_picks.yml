name: Daily Picks

# NOTE: KenPom uses Cloudflare which blocks cloud/datacenter IPs.
# Cron schedule is disabled until a workaround is found.
# For now, run ./update_picks.sh locally to generate and push picks.

on:
  # schedule:
  #   - cron: "0 14 * * *"
  #   - cron: "0 20 * * *"
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install kenpompy cloudscraper numpy pandas requests scikit-learn beautifulsoup4 html5lib lxml rich pyarrow

      - name: Generate predictions
        env:
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PW: ${{ secrets.KENPOM_PW }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m src.cbb.predict_daily --json --save

      - name: Commit and push picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/picks.json
          git diff --staged --quiet || git commit -m "Update daily picks $(date -u +%Y-%m-%d)"
          git push
